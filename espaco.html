<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Espacial - Relatividade & Supernovas v11</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; }
        
        #ui { position: absolute; top: 15px; left: 15px; color: #00ffff; pointer-events: none; text-shadow: 0px 0px 5px rgba(0, 255, 255, 0.5); font-size: 14px; line-height: 1.6; z-index: 10; letter-spacing: 1px; display: none; }
        
        /* Sistema de Menus em Hierarquia (Esc) */
        #menuContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 15, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; cursor: default; }
        
        /* Menu Principal de Pausa */
        #mainPauseMenu { display: flex; flex-direction: column; align-items: center; }
        #mainPauseMenu h1 { margin-top: 0; color: #00ffff; text-shadow: 0 0 15px #00ffff; font-size: 40px; letter-spacing: 5px; margin-bottom: 40px; }
        .menu-btn { background: rgba(0, 255, 255, 0.1); border: 2px solid #00ffff; color: #00ffff; padding: 15px 20px; font-size: 18px; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 3px; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; margin: 10px; width: 350px; box-sizing: border-box; }
        .menu-btn:hover { background: rgba(0, 255, 255, 0.3); box-shadow: 0 0 15px rgba(0, 255, 255, 0.5); transform: scale(1.02); }

        /* Sub-Menu de Configurações */
        #configOptionsMenu { display: none; background: rgba(10, 20, 30, 0.95); border: 2px solid #00ffff; border-radius: 8px; padding: 40px; box-shadow: 0 0 30px rgba(0, 255, 255, 0.4); text-align: left; min-width: 350px; }
        #configOptionsMenu h2 { margin-top: 0; color: #00ffff; text-shadow: 0 0 10px #00ffff; font-size: 26px; letter-spacing: 3px; border-bottom: 1px solid rgba(0, 255, 255, 0.3); padding-bottom: 15px; margin-bottom: 25px; text-align: center; }
        .option-label { color: #ddd; font-size: 16px; margin: 15px 0; display: flex; align-items: center; cursor: pointer; letter-spacing: 1px; }
        .option-label:hover { color: #fff; }
        .option-label input { margin-right: 15px; cursor: pointer; width: 18px; height: 18px; accent-color: #00ffff; }

        #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 200; text-align: center; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background-color: rgba(255, 255, 255, 0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; box-shadow: 0 0 8px rgba(255, 255, 255, 0.5); display: none; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #aaa; pointer-events: none; opacity: 0.9; font-size: 12px; text-shadow: 1px 1px 2px black; z-index: 10; letter-spacing: 1.5px; display: none; }
        #notification { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); color: #ffaa00; font-size: 14px; font-weight: bold; text-shadow: 0 0 10px #ffaa00; background: rgba(50, 20, 0, 0.7); padding: 12px 25px; border: 1px solid #ffaa00; border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 100; letter-spacing: 1px; }
        
        #startMenu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #111 0%, #000 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 50; }
        #startMenu h1 { font-size: 64px; margin-bottom: 5px; color: #fff; text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; font-weight: 900; letter-spacing: 8px; text-transform: uppercase; }
        #startMenu h2 { font-size: 20px; color: #00ffff; font-weight: 400; letter-spacing: 5px; margin-bottom: 50px; opacity: 0.8; }
        #startBtn { background: rgba(0, 255, 255, 0.1); border: 2px solid #00ffff; color: #00ffff; padding: 15px 40px; font-size: 20px; font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 3px; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 255, 255, 0.2); }
        #startBtn:hover { background: rgba(0, 255, 255, 0.3); box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); transform: scale(1.05); }

        #flashOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #fff; opacity: 0; pointer-events: none; z-index: 9999; mix-blend-mode: screen; transition: opacity 0.1s; }

        .highlight { color: #fff; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
        .mode-slow { color: #03a9f4; font-weight: bold; text-shadow: 0 0 8px #03a9f4; }
        .mode-local { color: #4caf50; font-weight: bold; text-shadow: 0 0 8px #4caf50; }
        .mode-hyper { color: #f44336; font-weight: bold; text-shadow: 0 0 8px #f44336; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="startMenu">
        <h1>SIMULADOR ESPACIAL</h1>
        <h2>EXPLORAÇÃO PROCEDURAL v11</h2>
        <button id="startBtn">INICIAR SESSÃO</button>
    </div>

    <div id="flashOverlay"></div>

    <div id="menuContainer">
        <div id="mainPauseMenu">
            <h1>JOGO PAUSADO</h1>
            <button id="resumeBtn" class="menu-btn">RETOMAR VOO</button>
            <button id="openOptionsBtn" class="menu-btn">OPÇÕES DE SISTEMA</button>
        </div>

        <div id="configOptionsMenu">
            <h2>CONFIGURAÇÕES</h2>
            <label class="option-label">
                <input type="checkbox" id="muteToggle"> Silenciar Áudio
            </label>
            <label class="option-label">
                <input type="checkbox" id="flashToggle" checked> Clarão das Supernovas
            </label>
            <label class="option-label">
                <input type="checkbox" id="coordsToggle"> Mostrar Coordenadas
            </label>
            <label class="option-label">
                <input type="checkbox" id="legendToggle" checked> Mostrar Atalhos
            </label>
            <button id="backToPauseBtn" class="menu-btn" style="margin-top: 25px; width: 100%; font-size: 16px;">VOLTAR (ESC)</button>
        </div>
    </div>

    <div id="gameOverScreen"></div>

    <div id="ui">
        MOTOR: <span id="flightModeDisplay" class="mode-local">IMPULSO (Sistema)</span><br>
        VELOCIDADE: <span id="speedDisplay">0</span> m/s<br>
        <div id="coordsContainer" style="display: none; margin-top: 5px;">
            SETOR ASTEROIDES: <span id="microChunkDisplay">0, 0, 0</span><br>
            SETOR PLANETÁRIO: <span id="systemChunkDisplay">0, 0, 0</span><br>
            SETOR ESTELAR: <span id="macroChunkDisplay">0, 0, 0</span>
        </div>
    </div>
    
    <div id="notification"></div>
    <div id="crosshair"></div>
    
    <div id="instructions">
        <span class="highlight">W A S D</span> MOVER | <span class="highlight">SHIFT / ESPAÇO</span> VERTICAL | <span class="highlight">X</span> FREIO | <span class="highlight">TAB</span> MOTOR | <span class="highlight">ESC</span> PAUSA | <span class="highlight">P</span> ANOMALIA
    </div>

    <script>
        // ==========================================
        // 0. ESTADO, SISTEMA DE MENUS E ÁUDIO
        // ==========================================
        let audioCtx, masterGain, engineOsc, engineGain, noiseSource, noiseFilter, ambientGain;
        let isAudioReady = false; 
        
        let isMuted = false;
        let flashEnabled = true;

        const menuContainer = document.getElementById('menuContainer');
        const mainPauseMenu = document.getElementById('mainPauseMenu');
        const configOptionsMenu = document.getElementById('configOptionsMenu');
        
        const resumeBtn = document.getElementById('resumeBtn');
        const openOptionsBtn = document.getElementById('openOptionsBtn');
        const backToPauseBtn = document.getElementById('backToPauseBtn');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        const muteToggle = document.getElementById('muteToggle');
        const flashToggle = document.getElementById('flashToggle');
        const coordsToggle = document.getElementById('coordsToggle');
        const legendToggle = document.getElementById('legendToggle');
        
        const coordsContainer = document.getElementById('coordsContainer');
        const instructions = document.getElementById('instructions');

        resumeBtn.addEventListener('click', () => { document.body.requestPointerLock(); });
        openOptionsBtn.addEventListener('click', () => { mainPauseMenu.style.display = 'none'; configOptionsMenu.style.display = 'block'; });
        backToPauseBtn.addEventListener('click', () => { configOptionsMenu.style.display = 'none'; mainPauseMenu.style.display = 'flex'; });

        configOptionsMenu.addEventListener('click', (e) => e.stopPropagation());
        mainPauseMenu.addEventListener('click', (e) => e.stopPropagation());

        muteToggle.addEventListener('change', (e) => { isMuted = e.target.checked; if (masterGain) masterGain.gain.value = isMuted ? 0 : 1; });
        flashToggle.addEventListener('change', (e) => { flashEnabled = e.target.checked; if (!flashEnabled) document.getElementById('flashOverlay').style.opacity = 0; });
        coordsToggle.addEventListener('change', (e) => { coordsContainer.style.display = e.target.checked ? 'block' : 'none'; });
        legendToggle.addEventListener('change', (e) => { instructions.style.display = e.target.checked ? 'block' : 'none'; });

        function initAudio() {
            if (isAudioReady) return; const AudioContext = window.AudioContext || window.webkitAudioContext; audioCtx = new AudioContext();
            masterGain = audioCtx.createGain(); masterGain.gain.value = isMuted ? 0 : 1; masterGain.connect(audioCtx.destination);
            engineOsc = audioCtx.createOscillator(); engineOsc.type = 'sine'; engineOsc.frequency.value = 40; 
            engineGain = audioCtx.createGain(); engineGain.gain.value = 0; 
            engineOsc.connect(engineGain).connect(masterGain); engineOsc.start();
            const bufferSize = audioCtx.sampleRate * 2; const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = noiseBuffer; noiseSource.loop = true;
            noiseFilter = audioCtx.createBiquadFilter(); noiseFilter.type = 'lowpass'; noiseFilter.frequency.value = 100;
            ambientGain = audioCtx.createGain(); ambientGain.gain.value = 0;
            noiseSource.connect(noiseFilter).connect(ambientGain).connect(masterGain); noiseSource.start(); isAudioReady = true;
        }

        function playNotificationSound() {
            if (!isAudioReady || isMuted || audioCtx.state === 'suspended') return;
            const notifOsc = audioCtx.createOscillator(); const notifGain = audioCtx.createGain(); notifOsc.type = 'sine';
            notifOsc.frequency.setValueAtTime(880, audioCtx.currentTime); notifOsc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1); 
            notifGain.gain.setValueAtTime(0, audioCtx.currentTime); notifGain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05); notifGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
            notifOsc.connect(notifGain).connect(masterGain); notifOsc.start(); notifOsc.stop(audioCtx.currentTime + 1.0);
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.innerText = text; notif.style.opacity = 1; playNotificationSound();
            setTimeout(() => { notif.style.opacity = 0; }, 6000);
        }

        // ==========================================
        // 1. CONFIGURAÇÃO BÁSICA
        // ==========================================
        const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x000000, 0.00000002);
        const baseFOV = 75; const camera = new THREE.PerspectiveCamera(baseFOV, window.innerWidth / window.innerHeight, 0.1, 500000000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement);
        const ambientLight = new THREE.AmbientLight(0x1a1a1a); scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xfff5e6, 1.2); directionalLight.position.set(1, 1, 1).normalize(); scene.add(directionalLight);

        let gameStarted = false;
        document.getElementById('startBtn').addEventListener('click', () => {
            document.getElementById('startMenu').style.display = 'none'; 
            document.getElementById('ui').style.display = 'block'; 
            document.getElementById('crosshair').style.display = 'block'; 
            if(legendToggle.checked) instructions.style.display = 'block';
            initAudio(); document.body.requestPointerLock(); gameStarted = true;
        });

        // ==========================================
        // 2. FÍSICA E CONTROLES
        // ==========================================
        const player = new THREE.Object3D(); scene.add(player); player.add(camera); const velocity = new THREE.Vector3(); let isPaused = true; let isDead = false;
        const FLIGHT_MODES = [
            { name: "PRECISÃO (Asteroides)", class: "mode-slow", accel: 10, maxSpeed: 100 },      
            { name: "IMPULSO (Sistema)", class: "mode-local", accel: 2500, maxSpeed: 50000 },    
            { name: "HYPERDRIVE (Interestelar)", class: "mode-hyper", accel: 200000, maxSpeed: 10000000 }
        ];
        let currentModeIndex = 1; const keys = { w: false, a: false, s: false, d: false, space: false, shift: false, x: false };
        
        document.addEventListener('keydown', (e) => {
            if (!gameStarted || isDead) return;
            if (e.code === 'Escape' && isPaused) {
                if (configOptionsMenu.style.display === 'block') { configOptionsMenu.style.display = 'none'; mainPauseMenu.style.display = 'flex'; } 
                else { document.body.requestPointerLock(); }
                return;
            }
            if (isPaused) return;

            if (e.code === 'KeyW') keys.w = true; if (e.code === 'KeyS') keys.s = true; if (e.code === 'KeyA') keys.a = true; if (e.code === 'KeyD') keys.d = true; if (e.code === 'Space') keys.space = true; if (e.code === 'ShiftLeft') keys.shift = true; if (e.code === 'KeyX') keys.x = true;
            
            if (e.code === 'Tab') { 
                e.preventDefault(); currentModeIndex = (currentModeIndex + 1) % FLIGHT_MODES.length; 
                const newMode = FLIGHT_MODES[currentModeIndex]; const modeDisplay = document.getElementById('flightModeDisplay'); 
                modeDisplay.innerText = newMode.name; modeDisplay.className = newMode.class; 
            }
            if (e.code === 'KeyP') { const forward = new THREE.Vector3(); camera.getWorldDirection(forward); spawnSupernova(forward); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false; if (e.code === 'KeyS') keys.s = false; if (e.code === 'KeyA') keys.a = false; if (e.code === 'KeyD') keys.d = false; if (e.code === 'Space') keys.space = false; if (e.code === 'ShiftLeft') keys.shift = false; if (e.code === 'KeyX') keys.x = false;
        });

        let pitch = 0, yaw = 0; 
        document.addEventListener('pointerlockchange', () => {
            if (isDead || !gameStarted) return;
            if (document.pointerLockElement === document.body) { 
                isPaused = false; menuContainer.style.display = 'none'; configOptionsMenu.style.display = 'none'; mainPauseMenu.style.display = 'flex';
                if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); clock.getDelta(); 
            } else { 
                isPaused = true; menuContainer.style.display = 'flex'; 
                if(audioCtx) { engineGain.gain.value = 0; ambientGain.gain.value = 0; } 
                for (let k in keys) keys[k] = false; 
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body && !isPaused && !isDead) { yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002; pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch)); camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ')); }
        });

        // ==========================================
        // 3. TEXTURAS
        // ==========================================
        const glowCanvas = document.createElement('canvas'); glowCanvas.width = 128; glowCanvas.height = 128; const ctx = glowCanvas.getContext('2d'); const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, 'rgba(255,255,255,1.0)'); gradient.addColorStop(0.2, 'rgba(255,255,255,0.6)'); gradient.addColorStop(0.5, 'rgba(255,255,255,0.2)'); gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, 128, 128); const glowTexture = new THREE.CanvasTexture(glowCanvas);

        const cloudCanvas = document.createElement('canvas'); cloudCanvas.width = 512; cloudCanvas.height = 512; const cCtx = cloudCanvas.getContext('2d'); cCtx.fillStyle = 'rgba(0,0,0,0)'; cCtx.fillRect(0,0,512,512);
        for(let i = 0; i < 250; i++) { cCtx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.15 + 0.05})`; cCtx.beginPath(); cCtx.arc(Math.random() * 512, Math.random() * 512, Math.random() * 40 + 10, 0, Math.PI * 2); cCtx.fill(); }
        const cloudTexture = new THREE.CanvasTexture(cloudCanvas); cloudTexture.wrapS = THREE.RepeatWrapping; cloudTexture.wrapT = THREE.RepeatWrapping;

        const particleCanvas = document.createElement('canvas'); particleCanvas.width = 64; particleCanvas.height = 64; const pCtx = particleCanvas.getContext('2d'); const pGrad = pCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
        pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.3, 'rgba(255,255,255,0.8)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)'); pCtx.fillStyle = pGrad; pCtx.fillRect(0, 0, 64, 64); const particleTexture = new THREE.CanvasTexture(particleCanvas);

        function createStarSurfaceTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 512; const sCtx = canvas.getContext('2d'); sCtx.fillStyle = '#ffffff'; sCtx.fillRect(0, 0, 1024, 512);
            for(let i=0; i < 80000; i++) { sCtx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.25})`; sCtx.fillRect(Math.random() * 1024, Math.random() * 512, Math.random() * 3 + 1, Math.random() * 3 + 1); }
            for(let i=0; i < 3; i++) {
                const x = Math.random() * 1024; const y = Math.random() * 512; const radius = 10 + Math.random() * 25; const spotGrad = sCtx.createRadialGradient(x, y, 0, x, y, radius);
                spotGrad.addColorStop(0, 'rgba(20, 5, 0, 0.9)'); spotGrad.addColorStop(0.4, 'rgba(80, 20, 0, 0.7)'); spotGrad.addColorStop(0.8, 'rgba(200, 50, 0, 0.3)'); spotGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                sCtx.fillStyle = spotGrad; sCtx.beginPath(); sCtx.arc(x, y, radius, 0, Math.PI * 2); sCtx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex;
        }
        const starSurfaceMap = createStarSurfaceTexture();

        // ==========================================
        // 4. GERAÇÃO PROCEDURAL
        // ==========================================
        const MICRO_CHUNK_SIZE = 4000; const MICRO_RENDER_DIST = 1;      
        const SYSTEM_CHUNK_SIZE = 300000; const SYSTEM_RENDER_DIST = 1;
        const MACRO_CHUNK_SIZE = 20000000; const MACRO_RENDER_DIST = 1;      
        
        const activeMicroChunks = new Map(); const activeSystemChunks = new Map(); const activeMacroChunks = new Map();
        const dummy = new THREE.Object3D(); const dummyColor = new THREE.Color();

        function getSeededRandom(x, y, z, index) { let seed = (x * 73856) ^ (y * 19349) ^ (z * 83492) + index; let val = Math.sin(seed) * 43758.5453; return val - Math.floor(val); }

        const astGeometries = [new THREE.DodecahedronGeometry(1, 0), new THREE.DodecahedronGeometry(1, 1), new THREE.IcosahedronGeometry(1, 0), new THREE.TetrahedronGeometry(1, 1)];
        const astMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.1 }); const planetGeom = new THREE.SphereGeometry(1, 64, 64);
        const ASTEROID_COLORS = [0x4a4a4a, 0x696969, 0x8b7355, 0x5c5044, 0x3d4045, 0x7a7266];

        function generateMicroChunk(cx, cy, cz) {
            const group = new THREE.Group(); group.position.set(cx * MICRO_CHUNK_SIZE, cy * MICRO_CHUNK_SIZE, cz * MICRO_CHUNK_SIZE); const chunkData = { group, asteroidsMesh: null, asteroidData: [] };
            const numAsteroids = Math.floor(10 + getSeededRandom(cx, cy, cz, 13) * 30); chunkData.asteroidsMesh = new THREE.InstancedMesh(astGeometries[Math.floor(getSeededRandom(cx, cy, cz, 14) * astGeometries.length)], astMat, numAsteroids);
            for (let i = 0; i < numAsteroids; i++) {
                chunkData.asteroidData.push({
                    basePos: new THREE.Vector3((getSeededRandom(cx,cy,cz,i*20+20)-0.5)*MICRO_CHUNK_SIZE, (getSeededRandom(cx,cy,cz,i*20+21)-0.5)*MICRO_CHUNK_SIZE, (getSeededRandom(cx,cy,cz,i*20+22)-0.5)*MICRO_CHUNK_SIZE),
                    vel: new THREE.Vector3((getSeededRandom(cx,cy,cz,i*20+23)-0.5)*40, (getSeededRandom(cx,cy,cz,i*20+24)-0.5)*40, (getSeededRandom(cx,cy,cz,i*20+25)-0.5)*40),
                    rotVel: new THREE.Vector3((getSeededRandom(cx,cy,cz,i*20+26)-0.5)*2, (getSeededRandom(cx,cy,cz,i*20+27)-0.5)*2, (getSeededRandom(cx,cy,cz,i*20+28)-0.5)*2),
                    scale: (() => { const sBase = 5 + getSeededRandom(cx, cy, cz, i * 20 + 29) * 50; return new THREE.Vector3(sBase * (0.8 + getSeededRandom(cx,cy,cz,i*20+30)*0.4), sBase * (0.6 + getSeededRandom(cx,cy,cz,i*20+31)*0.6), sBase * (0.8 + getSeededRandom(cx,cy,cz,i*20+32)*0.4)); })()
                });
                dummyColor.setHex(ASTEROID_COLORS[Math.floor(getSeededRandom(cx, cy, cz, i * 20 + 33) * ASTEROID_COLORS.length)]); chunkData.asteroidsMesh.setColorAt(i, dummyColor);
            }
            chunkData.asteroidsMesh.instanceColor.needsUpdate = true; group.add(chunkData.asteroidsMesh); scene.add(group); return chunkData;
        }

        function generateSystemChunk(cx, cy, cz) {
            const group = new THREE.Group(); group.position.set(cx * SYSTEM_CHUNK_SIZE, cy * SYSTEM_CHUNK_SIZE, cz * SYSTEM_CHUNK_SIZE); const chunkData = { group, comets: [], planets: [] };
            
            // Cometas
            if (getSeededRandom(cx, cy, cz, 400) > 0.97) {
                const cometGroup = new THREE.Group(); const core = new THREE.Mesh(new THREE.DodecahedronGeometry(80, 1), new THREE.MeshStandardMaterial({color: 0xccffff, emissive: 0x88ccff, emissiveIntensity: 0.5}));
                const tailGeo = new THREE.CylinderGeometry(15, 2500, 100000, 16, 1, true); tailGeo.translate(0, -50000, 0); const tailCanvas = document.createElement('canvas'); tailCanvas.width = 16; tailCanvas.height = 256;
                const tCtx = tailCanvas.getContext('2d'); const tGrad = tCtx.createLinearGradient(0, 0, 0, 256); tGrad.addColorStop(0, 'rgba(200, 255, 255, 0.9)'); tGrad.addColorStop(1, 'rgba(0, 0, 0, 0)'); tCtx.fillStyle = tGrad; tCtx.fillRect(0,0,16,256);

                if (shapeType === 0) { r = rBase * 50 * (1.0 + (Math.sin(u * 8) * Math.cos(v * 8) * 0.3)); x = r * Math.sin(v) * Math.cos(u); y = r * Math.cos(v); z = r * Math.sin(v) * Math.sin(u); }
                else if (shapeType === 1) { r = rBase * (1.0 + 4.0 * Math.pow(Math.abs(Math.cos(v)), 4)) * 30; const noise = 1.0 + (Math.sin(u * 10) * Math.cos(v * 10) * 0.2); x = r * Math.sin(v) * Math.cos(u) * noise; y = r * Math.cos(v) * 2.5 * noise; z = r * Math.sin(v) * Math.sin(u) * noise; }
                else if (shapeType === 2) { const ringDecide = Math.random(); let ringV = ringDecide < 0.33 ? Math.PI / 2 : (ringDecide < 0.66 ? Math.PI / 3 : 2 * Math.PI / 3); ringV += (Math.random() - 0.5) * 0.15; r = 30 + Math.random() * 20; x = r * Math.sin(ringV) * Math.cos(u); y = r * Math.cos(ringV) * 1.5; z = r * Math.sin(ringV) * Math.sin(u); }
                else if (shapeType === 3) { if (Math.random() < 0.7) { x = (Math.random() - 0.5) * 6 * rBase; y = (Math.random() < 0.5 ? 1 : -1) * (10 + rBase * 120); z = (Math.random() - 0.5) * 6 * rBase; } else { r = rBase * 50; x = r * Math.cos(u); y = (Math.random() - 0.5) * 1.5; z = r * Math.sin(u); } }
                else if (shapeType === 4) { r = rBase * 50; const kick = (Math.cos(v) + 1) / 2; y = (r * Math.cos(v)) + (kick * 30 * rBase); x = r * Math.sin(v) * Math.cos(u) * (0.5 + kick * 0.5); z = r * Math.sin(v) * Math.sin(u) * (0.5 + kick * 0.5); }
                else if (shapeType === 5) { r = rBase * 30 + (Math.pow(Math.abs(Math.sin(u * 12) * Math.cos(v * 12)), 2) * 30); x = r * Math.sin(v) * Math.cos(u); y = r * Math.cos(v); z = r * Math.sin(v) * Math.sin(u); }
                else if (shapeType === 6) { r = rBase * 45; y = r * Math.cos(v); if (y > 0) y *= 0.3; x = r * Math.sin(v) * Math.cos(u); z = r * Math.sin(v) * Math.sin(u); }
                else { if (Math.random() > 0.4) { const torusR = 25 + rBase * 25; const torusV = (Math.PI/2) + (Math.random() - 0.5) * 0.5; x = torusR * Math.sin(torusV) * Math.cos(u); y = torusR * Math.cos(torusV); z = torusR * Math.sin(torusV) * Math.sin(u); } else { r = rBase * 55; x = (Math.random() - 0.5) * 20 * rBase; y = (Math.random() > 0.5 ? 1 : -1) * r; z = (Math.random() - 0.5) * 20 * rBase; } }
                pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z;
                if (colorType === 0) { colorObj.setHSL(baseHue, 1, 0.3 + Math.random() * 0.5); } else if (colorType === 1) { colorObj.setHSL((Math.abs(y) > 20) ? (baseHue + 0.5) % 1.0 : baseHue, 1, 0.4 + Math.random() * 0.4); } else { colorObj.setHSL((baseHue + (Math.random() * 0.4 - 0.2)) % 1.0, 1, 0.3 + Math.random() * 0.6); }
                pCol[i*3] = colorObj.r; pCol[i*3+1] = colorObj.g; pCol[i*3+2] = colorObj.b;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3)); pGeo.computeBoundingSphere();
            const pMat = new THREE.PointsMaterial({ size: 250000, map: particleTexture, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
            const particles = new THREE.Points(pGeo, pMat); particles.frustumCulled = false; snGroup.add(particles); scene.add(snGroup);
            activeSupernovas.push({ group: snGroup, sprite: sprite, ring: shockRing, particles: particles, pMat: pMat, startTime: clock.getElapsedTime(), maxRadius: 15000000 + Math.random() * 20000000, baseHue: baseHue });
            showNotification("⚠️ UMA SUPERNOVA FOI DETECTADA");
        }

        function updateSupernovas(currentTime) {
            let globalFlashIntensity = 0;
            for (let i = activeSupernovas.length - 1; i >= 0; i--) {
                const sn = activeSupernovas[i]; const age = currentTime - sn.startTime;
                if (age > SUPERNOVA_DURATION) { scene.remove(sn.group); disposeHierarchy(sn.group); activeSupernovas.splice(i, 1); continue; }
                const progress = age / SUPERNOVA_DURATION; const currentScale = sn.maxRadius * Math.pow(progress, 0.4); 
                sn.group.scale.set(currentScale/100, currentScale/100, currentScale/100); sn.ring.scale.set(1 + progress * 2, 1 + progress * 2, 1);
                let particleOp = 1; let coreOp = 1; let spriteScaleMult = 1;
                
                if (progress < 0.05) { 
                    const flashProgress = progress / 0.05; particleOp = flashProgress; coreOp = Math.min(1.0, flashProgress * 1.5); spriteScaleMult = flashProgress * 0.015; 
                    globalFlashIntensity = Math.max(globalFlashIntensity, (1.0 - Math.abs(flashProgress - 0.5) * 2) * 0.9);
                } else { 
                    const fadeProgress = (progress - 0.05) / 0.95; particleOp = 1 - fadeProgress; coreOp = Math.max(0, 1 - (fadeProgress * 5)); spriteScaleMult = 0.015 * (1 - fadeProgress); 
                    if (progress < 0.08) { globalFlashIntensity = Math.max(globalFlashIntensity, (1 - ((progress - 0.05) / 0.03)) * 0.9); }
                }

                if (!flashEnabled) { globalFlashIntensity = 0; sn.sprite.visible = false; } else { sn.sprite.visible = true; }
                sn.pMat.opacity = particleOp * 0.8; sn.ring.material.opacity = particleOp * 0.5; sn.sprite.material.opacity = coreOp;
                const finalSpriteScale = sn.maxRadius * spriteScaleMult; sn.sprite.scale.set(finalSpriteScale, finalSpriteScale, 1); 
            }
            flashOverlay.style.opacity = globalFlashIntensity;
        }

        function disposeHierarchy(node) {
            node.traverse(child => { if (child.isMesh || child.isSprite || child.isPoints) { if (child.geometry) child.geometry.dispose(); if (child.material) { if (child.material.map) child.material.map.dispose(); child.material.dispose(); } } });
        }

        // ==========================================
        // 6. GERENCIAMENTO DE CHUNKS & ENGINE
        // ==========================================
        function manageChunks(activeMap, generator, chunkSize, renderDist, px, py, pz, displayId) {
            const curX = Math.floor(px / chunkSize + 0.5); const curY = Math.floor(py / chunkSize + 0.5); const curZ = Math.floor(pz / chunkSize + 0.5); document.getElementById(displayId).innerText = `${curX}, ${curY}, ${curZ}`; const needed = new Set();
            for (let x = -renderDist; x <= renderDist; x++) { for (let y = -renderDist; y <= renderDist; y++) { for (let z = -renderDist; z <= renderDist; z++) {
                const cx = curX + x, cy = curY + y, cz = curZ + z; const key = `${cx},${cy},${cz}`; needed.add(key); if (!activeMap.has(key)) activeMap.set(key, generator(cx, cy, cz));
            } } }
            for (const [key, chunkData] of activeMap.entries()) { if (!needed.has(key)) { const group = chunkData.group || chunkData; scene.remove(group); disposeHierarchy(group); activeMap.delete(key); } }
        }

        function updateChunks() {
            const px = player.position.x, py = player.position.y, pz = player.position.z;
            manageChunks(activeMicroChunks, generateMicroChunk, MICRO_CHUNK_SIZE, MICRO_RENDER_DIST, px, py, pz, 'microChunkDisplay'); manageChunks(activeSystemChunks, generateSystemChunk, SYSTEM_CHUNK_SIZE, SYSTEM_RENDER_DIST, px, py, pz, 'systemChunkDisplay'); manageChunks(activeMacroChunks, generateMacroChunk, MACRO_CHUNK_SIZE, MACRO_RENDER_DIST, px, py, pz, 'macroChunkDisplay');
        }

        function triggerGameOver() {
            isDead = true; isPaused = true; document.exitPointerLock(); menuContainer.style.display = 'none'; gameOverScreen.style.display = 'flex'; 
            gameOverScreen.innerHTML = `<h1 style="color:#ff0000; text-shadow:0 0 20px #ff0000; font-size:48px; letter-spacing:4px;">GAME OVER</h1><p style="color:#ffaaaa; letter-spacing:2px; font-size:18px;">[ HORIZONTE DE EVENTOS ALCANÇADO - SPAGHETTIFICATION CONCLUÍDA ]</p><p style="margin-top:40px; font-weight:bold; cursor:pointer; color:#fff; font-size:20px; border: 1px solid #fff; padding: 15px 30px; border-radius: 4px;" onclick="location.reload()">REINICIAR SISTEMA</p>`; 
            if (masterGain) { masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5); }
        }

        // ==========================================
        // 7. LOOP PRINCIPAL
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate); if (isDead || !gameStarted) { renderer.render(scene, camera); return; }
            const dt = clock.getDelta();
            if (!isPaused) {
                const elapsedTime = clock.getElapsedTime(); const currentMode = FLIGHT_MODES[currentModeIndex];
                const thrust = new THREE.Vector3(0, 0, 0); const forward = new THREE.Vector3(); camera.getWorldDirection(forward);
                const right = new THREE.Vector3(); right.crossVectors(forward, camera.up).normalize(); const up = new THREE.Vector3(); up.crossVectors(right, forward).normalize();

                if (keys.w) thrust.add(forward); if (keys.s) thrust.sub(forward); if (keys.d) thrust.add(right); if (keys.a) thrust.sub(right); if (keys.space) thrust.add(up); if (keys.shift) thrust.sub(up);
                const isThrusting = thrust.length() > 0; if (isThrusting) { thrust.normalize().multiplyScalar(currentMode.accel * dt * 100); velocity.add(thrust); }

                if (keys.x) { velocity.lerp(new THREE.Vector3(0, 0, 0), dt * 4.0); } else { const speed = velocity.length(); if (speed > currentMode.maxSpeed) { velocity.lerp(velocity.clone().normalize().multiplyScalar(currentMode.maxSpeed), dt * 2.5); } }

                if (Math.random() < 0.002 * dt) { spawnSupernova(); } updateSupernovas(elapsedTime);

                for (const chunkData of activeMacroChunks.values()) {
                    if (chunkData.starSystems) { for (const sys of chunkData.starSystems) { sys.mesh.rotation.y += dt * sys.rotSpeed; } }
                    if (chunkData.blackHoles) {
                        for (const bh of chunkData.blackHoles) {
                            const bhWorldPos = new THREE.Vector3(); bh.mesh.getWorldPosition(bhWorldPos); const dist = player.position.distanceTo(bhWorldPos); bh.mesh.children[0].rotation.z -= dt * 0.2; bh.mesh.children[1].rotation.z -= dt * 0.2; 
                            if (dist < bh.radius * 40) { const pullDir = bhWorldPos.clone().sub(player.position).normalize(); const factor = Math.pow((bh.radius * 25) / dist, 3); const pullStrength = factor * 200000; velocity.add(pullDir.multiplyScalar(pullStrength * dt)); if (dist < bh.radius * 1.1) { triggerGameOver(); return; } }
                        }
                    }
                }

                player.position.addScaledVector(velocity, dt); const currentSpeed = velocity.length();

                if (isAudioReady) {
                    const targetEngineVol = isThrusting ? (currentModeIndex === 2 ? 0.15 : 0.1) : 0.0; engineGain.gain.setTargetAtTime(targetEngineVol, audioCtx.currentTime, 0.1); engineOsc.frequency.setTargetAtTime((currentModeIndex === 2 ? 100 : 40) + (Math.min(currentSpeed / currentMode.maxSpeed, 1) * 100), audioCtx.currentTime, 0.2);
                    const hyperRatio = Math.min(currentSpeed / 10000000, 1.0); ambientGain.gain.setTargetAtTime(hyperRatio * 0.15, audioCtx.currentTime, 0.5); noiseFilter.frequency.setTargetAtTime(100 + (hyperRatio * 3000), audioCtx.currentTime, 0.5);
                }

                camera.fov = THREE.MathUtils.lerp(camera.fov, currentSpeed > 100000 ? baseFOV + 20 : baseFOV, dt * 2); camera.updateProjectionMatrix(); document.getElementById('speedDisplay').innerText = Math.floor(currentSpeed).toLocaleString(); updateChunks();

                for (const chunkData of activeSystemChunks.values()) {
                    if (chunkData.comets) { for (const comet of chunkData.comets) { comet.mesh.position.copy(comet.basePos).addScaledVector(comet.vel, elapsedTime); comet.mesh.children[0].rotation.y += dt; } }
                    if (chunkData.planets) { 
                        for (const planetData of chunkData.planets) { 
                            planetData.mesh.rotation.y += dt * planetData.rotSpeed; 
                            if (planetData.clouds) { planetData.clouds.mesh.rotation.y += dt * planetData.clouds.rotSpeed; } 
                            if (planetData.moons) {
                                for (const moon of planetData.moons) {
                                    moon.pivot.rotation.y += dt * moon.speed;
                                    moon.mesh.rotation.y += dt * moon.rotSpeed;
                                }
                            }
                        } 
                    }
                }

                for (const chunkData of activeMicroChunks.values()) {
                    if (chunkData.asteroidsMesh) {
                        if (currentSpeed > 100000) { chunkData.asteroidsMesh.visible = false; } else {
                            chunkData.asteroidsMesh.visible = true; const dataArray = chunkData.asteroidData;
                            for (let i = 0; i < dataArray.length; i++) {
                                const data = dataArray[i]; dummy.position.copy(data.basePos).addScaledVector(data.vel, elapsedTime);
                                dummy.rotation.set(data.rotVel.x * elapsedTime, data.rotVel.y * elapsedTime, data.rotVel.z * elapsedTime); dummy.scale.copy(data.scale); dummy.updateMatrix(); chunkData.asteroidsMesh.setMatrixAt(i, dummy.matrix);
                            }
                            chunkData.asteroidsMesh.instanceMatrix.needsUpdate = true;
                        }
                    }
                }
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }); animate();
    </script>
